name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (go stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: gofmt -l . | tee /dev/stderr | (! read)
